services:
  rpi-dashboard:
    build: .
    container_name: rpi-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"

    # ----------------------------------------------------------------
    # Host system access — required so the dashboard can read real
    # hardware data from the Pi via /proc, /sys, etc.
    # ----------------------------------------------------------------
    volumes:
      # Core system stats (uptime, CPU load, memory)
      - /proc:/proc:ro
      # CPU temperature & frequency
      - /sys:/sys:ro
      # OS release info  (cat /etc/os-release)
      - /etc/os-release:/etc/os-release:ro
      # Show the Pi's real hostname instead of the container ID
      - /etc/hostname:/etc/hostname:ro
      - /etc/hosts:/etc/hosts:ro
      # lsusb — access to USB devices list
      - /dev/bus/usb:/dev/bus/usb:ro
      # Systemd shutdown scheduling (Power management feature)
      - /run/systemd:/run/systemd:ro
      # Persist only the dashboard config file across container restarts.
      # Do NOT mount the whole /var/www/html/ — that would shadow all app files!
      - rpi_dashboard_config:/var/www/html/local.config

    # ----------------------------------------------------------------
    # Capabilities needed for shutdown/reboot support.
    # Remove cap_sys_boot if you don't use the Power Management feature.
    # ----------------------------------------------------------------
    cap_add:
      - SYS_BOOT   # allows shutdown/reboot commands

    # Needed so www-data can call `sudo /sbin/shutdown`
    # and access hardware device info (vcgencmd, lsusb, etc.)
    privileged: true

    environment:
      # Set your timezone so timestamps match your local time
      - TZ=America/Argentina/Buenos_Aires

volumes:
  rpi_dashboard_config:
