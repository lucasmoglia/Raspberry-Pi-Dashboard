services:
  rpi-dashboard:
    build: .
    container_name: rpi-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"

    # ----------------------------------------------------------------
    # Host system access — required so the dashboard can read real
    # hardware data from the Pi via /proc, /sys, etc.
    # ----------------------------------------------------------------
    volumes:
      # Core system stats (uptime, CPU load, memory)
      - /proc:/proc:ro
      # CPU temperature & frequency
      - /sys:/sys:ro
      # OS release info  (cat /etc/os-release)
      - /etc/os-release:/etc/os-release:ro
      # Show the Pi's real hostname instead of the container ID
      - /etc/hostname:/etc/hostname:ro
      - /etc/hosts:/etc/hosts:ro
      # lsusb — access to USB devices list
      - /dev/bus/usb:/dev/bus/usb:ro
      # RPi-specific hardware utility (vcgencmd)
      # We mount these from the host so the container can "borrow" them from your system.
      - /usr/bin/vcgencmd:/usr/bin/vcgencmd:ro
      - /usr/lib/arm-linux-gnueabihf:/usr/lib/arm-linux-gnueabihf:ro
      - /usr/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu:ro
      - /opt/vc:/opt/vc:ro
      # Systemd shutdown scheduling (Power management feature)
      - /run/systemd:/run/systemd:ro
      # Persist the dashboard config directory across container restarts.
      # The entrypoint.sh handles symlinking local.config into the web root.
      - rpi_dashboard_config:/var/rpi-config

    # ----------------------------------------------------------------
    # Capabilities needed for shutdown/reboot support.
    # Remove cap_sys_boot if you don't use the Power Management feature.
    # ----------------------------------------------------------------
    cap_add:
      - SYS_BOOT   # allows shutdown/reboot commands

    # ----------------------------------------------------------------
    # RPi GPU devices — required for vcgencmd (core voltage, firmware)
    # ----------------------------------------------------------------
    devices:
      - /dev/vcio:/dev/vcio       # GPU mailbox (vcgencmd measure_volts etc.)
      - /dev/vchiq:/dev/vchiq     # VideoCore interface (firmware version etc.)

    # Needed so www-data can call `sudo /sbin/shutdown`
    # and access hardware device info (vcgencmd, lsusb, etc.)
    privileged: true

    environment:
      # Set your timezone so timestamps match your local time
      - TZ=America/Argentina/Buenos_Aires
      # Ensure the hardware utility can find its libraries
      - LD_LIBRARY_PATH=/opt/vc/lib:/usr/lib/arm-linux-gnueabihf:/usr/lib/aarch64-linux-gnu
      - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/vc/bin

volumes:
  rpi_dashboard_config:
